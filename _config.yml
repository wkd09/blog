title: "Junmin's Notes"
subtitle: "AI, LLM & Systems"
name: "Junmin Jang"
description: "Notes on AI, LLMs, agents, and systems."
url: "https://wkd09.github.io"
baseurl: "/blog"
repository: "wkd09/blog"
locale: "ko-KR"
timezone: "Asia/Seoul"

theme: "minimal-mistakes-jekyll"
minimal_mistakes_skin: "default"
date_format: "%Y.%m.%d"
words_per_minute: 180

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

author:
  name: "Junmin Jang"
  avatar: "/assets/images/chikeke.webp"
  bio: "AI, LLM & Systems"
  location: "South Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/wkd09"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:wkdwnsals0413@gmail.com"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/wkd09"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:wkdwnsals0413@gmail.com"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author_profile: true
      show_date: true
      read_time: true
      toc: true
      toc_sticky: true
      toc_label: "목차"
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

search: true
search_full_content: true
after_footer_scripts:
  - /assets/js/mathjax-config.js

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _templates
  - admin-app
