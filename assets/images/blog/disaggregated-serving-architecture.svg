<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">통합형 서빙과 분리형 서빙 구조 비교</title>
  <desc id="desc">통합형은 하나의 GPU 풀에서 Prefill과 Decode가 경쟁하고, 분리형은 두 전용 풀 사이에서 KV cache를 전달한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 650; }
      .body { font-size: 15px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .gpu { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="47" text-anchor="middle" class="title">Prefill과 Decode를 어디서 실행할 것인가</text>
  <text x="600" y="74" text-anchor="middle" class="body">같은 모델을 사용해도 실행 단계를 분리하면 스케줄링과 확장 단위가 달라진다</text>

  <rect x="45" y="105" width="520" height="505" rx="8" class="box"/>
  <text x="75" y="148" class="label">통합형 serving</text>
  <text x="75" y="174" class="body">하나의 GPU pool이 두 단계를 함께 처리</text>

  <text x="74" y="270" class="body">요청</text>
  <line x1="112" y1="265" x2="168" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="220" width="185" height="185" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="272" y="250" text-anchor="middle" class="label">공유 GPU pool</text>
  <g>
    <rect x="207" y="272" width="132" height="28" rx="4" class="gpu"/>
    <circle cx="224" cy="286" r="4" fill="#64748b"/><line x1="239" y1="286" x2="323" y2="286" stroke="#cbd5e1"/>
    <rect x="207" y="310" width="132" height="28" rx="4" class="gpu"/>
    <circle cx="224" cy="324" r="4" fill="#64748b"/><line x1="239" y1="324" x2="323" y2="324" stroke="#cbd5e1"/>
    <rect x="207" y="348" width="132" height="28" rx="4" class="gpu"/>
    <circle cx="224" cy="362" r="4" fill="#64748b"/><line x1="239" y1="362" x2="323" y2="362" stroke="#cbd5e1"/>
  </g>

  <line x1="365" y1="285" x2="418" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="235" width="100" height="46" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="264" text-anchor="middle" class="label" fill="#1d4ed8">Prefill</text>
  <rect x="430" y="326" width="100" height="46" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="480" y="355" text-anchor="middle" class="label" fill="#c2410c">Decode</text>
  <path d="M480 286V316" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="480" y="412" text-anchor="middle" class="body" fill="#b91c1c">같은 queue · 같은 자원</text>

  <line x1="92" y1="465" x2="518" y2="465" stroke="#e2e8f0"/>
  <text x="92" y="501" class="label">결과</text>
  <text x="92" y="532" class="body">• 긴 prefill이 decode step을 지연할 수 있음</text>
  <text x="92" y="558" class="body">• 한 단계만 부족해도 전체 pool을 함께 확장</text>

  <rect x="635" y="105" width="520" height="505" rx="8" class="box"/>
  <text x="665" y="148" class="label">Disaggregated serving</text>
  <text x="665" y="174" class="body">실행 단계마다 전용 GPU pool을 배치</text>

  <text x="665" y="270" class="body">요청</text>
  <line x1="703" y1="265" x2="748" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="210" width="150" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="835" y="240" text-anchor="middle" class="label" fill="#1d4ed8">Prefill pool</text>
  <text x="835" y="264" text-anchor="middle" class="small">compute-bound</text>
  <g>
    <rect x="782" y="284" width="106" height="24" rx="3" class="gpu"/>
    <circle cx="797" cy="296" r="3.5" fill="#2563eb"/><line x1="810" y1="296" x2="875" y2="296" stroke="#bfdbfe"/>
    <rect x="782" y="317" width="106" height="24" rx="3" class="gpu"/>
    <circle cx="797" cy="329" r="3.5" fill="#2563eb"/><line x1="810" y1="329" x2="875" y2="329" stroke="#bfdbfe"/>
  </g>

  <line x1="910" y1="285" x2="978" y2="285" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="944" y="250" text-anchor="middle" class="small" fill="#6d28d9">KV cache</text>
  <text x="944" y="269" text-anchor="middle" class="small" fill="#6d28d9">transfer</text>

  <rect x="990" y="210" width="135" height="150" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="1057" y="240" text-anchor="middle" class="label" fill="#c2410c">Decode pool</text>
  <text x="1057" y="264" text-anchor="middle" class="small">memory-bound</text>
  <g>
    <rect x="1005" y="284" width="105" height="24" rx="3" class="gpu"/>
    <circle cx="1020" cy="296" r="3.5" fill="#f97316"/><line x1="1033" y1="296" x2="1097" y2="296" stroke="#fed7aa"/>
    <rect x="1005" y="317" width="105" height="24" rx="3" class="gpu"/>
    <circle cx="1020" cy="329" r="3.5" fill="#f97316"/><line x1="1033" y1="329" x2="1097" y2="329" stroke="#fed7aa"/>
  </g>

  <line x1="688" y1="465" x2="1112" y2="465" stroke="#e2e8f0"/>
  <text x="688" y="501" class="label">결과</text>
  <text x="688" y="532" class="body">• TTFT와 ITL을 서로 다른 policy로 관리</text>
  <text x="688" y="558" class="body">• traffic에 따라 두 pool을 독립적으로 확장</text>

  <text x="600" y="648" text-anchor="middle" class="small">개념도 · 실제 구성은 model, network, scheduler에 따라 달라진다</text>
</svg>
