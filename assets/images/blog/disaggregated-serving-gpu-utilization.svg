<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">통합형과 분리형 서빙의 GPU utilization 개념도</title>
  <desc id="desc">통합형 GPU는 긴 prefill 구간에서 utilization이 급증하고 decode가 지연된다. 분리형은 prefill GPU와 decode GPU를 독립적으로 운영한다.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 650; }
      .body { font-size: 14px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="70" y="48" class="title">GPU utilization은 왜 흔들릴까?</text>
  <text x="70" y="75" class="body">실측 benchmark가 아닌 scheduling 차이를 설명하기 위한 개념도</text>

  <circle cx="885" cy="48" r="6" fill="#2563eb"/><text x="899" y="53" class="body">Prefill</text>
  <circle cx="985" cy="48" r="6" fill="#f97316"/><text x="999" y="53" class="body">Decode</text>
  <line x1="1090" y1="48" x2="1110" y2="48" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1118" y="53" class="body">대기</text>

  <text x="70" y="122" class="label">A. 통합형 — 하나의 GPU pool</text>
  <text x="70" y="145" class="small">긴 prefill이 실행되는 동안 decode request는 scheduler에서 기다릴 수 있다</text>

  <g>
    <line x1="110" y1="170" x2="110" y2="340" class="axis"/>
    <line x1="110" y1="340" x2="1130" y2="340" class="axis"/>
    <line x1="110" y1="170" x2="1130" y2="170" class="grid"/>
    <line x1="110" y1="255" x2="1130" y2="255" class="grid"/>
    <text x="98" y="174" text-anchor="end" class="small">높음</text>
    <text x="98" y="344" text-anchor="end" class="small">낮음</text>
    <text x="52" y="260" text-anchor="middle" class="small" transform="rotate(-90 52 260)">GPU utilization</text>

    <path d="M110 330 L150 322 L180 315 L205 190 L230 182 L255 198 L280 180 L305 193 L330 185 L355 315 L395 320 L435 314 L470 326 L510 318 L545 312 L570 188 L595 180 L620 195 L645 184 L670 198 L695 186 L720 317 L760 323 L800 314 L840 326 L880 318 L915 312 L940 190 L965 181 L990 196 L1015 183 L1040 194 L1065 185 L1090 315 L1130 324 L1130 340 L110 340 Z" fill="#dbeafe"/>
    <path d="M110 330 L150 322 L180 315 L205 190 L230 182 L255 198 L280 180 L305 193 L330 185 L355 315 L395 320 L435 314 L470 326 L510 318 L545 312 L570 188 L595 180 L620 195 L645 184 L670 198 L695 186 L720 317 L760 323 L800 314 L840 326 L880 318 L915 312 L940 190 L965 181 L990 196 L1015 183 L1040 194 L1065 185 L1090 315 L1130 324" fill="none" stroke="#2563eb" stroke-width="3"/>

    <rect x="195" y="158" width="170" height="24" rx="3" fill="#eff6ff"/>
    <text x="280" y="175" text-anchor="middle" class="small" fill="#1d4ed8">긴 prompt prefill</text>
    <rect x="560" y="158" width="170" height="24" rx="3" fill="#eff6ff"/>
    <text x="645" y="175" text-anchor="middle" class="small" fill="#1d4ed8">긴 prompt prefill</text>
    <rect x="930" y="158" width="170" height="24" rx="3" fill="#eff6ff"/>
    <text x="1015" y="175" text-anchor="middle" class="small" fill="#1d4ed8">긴 prompt prefill</text>

    <line x1="375" y1="292" x2="520" y2="292" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="447" y="282" text-anchor="middle" class="small" fill="#b91c1c">decode 대기 / ITL 증가</text>
    <line x1="740" y1="292" x2="900" y2="292" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="820" y="282" text-anchor="middle" class="small" fill="#b91c1c">decode 대기 / ITL 증가</text>
  </g>

  <text x="70" y="397" class="label">B. 분리형 — 역할별 GPU pool</text>
  <text x="70" y="420" class="small">두 utilization 곡선은 서로 다른 GPU에서 측정되며, 각 pool은 독립적으로 확장된다</text>

  <g>
    <line x1="110" y1="445" x2="110" y2="605" class="axis"/>
    <line x1="110" y1="605" x2="1130" y2="605" class="axis"/>
    <line x1="110" y1="445" x2="1130" y2="445" class="grid"/>
    <line x1="110" y1="525" x2="1130" y2="525" class="grid"/>
    <text x="98" y="449" text-anchor="end" class="small">높음</text>
    <text x="98" y="609" text-anchor="end" class="small">낮음</text>
    <text x="52" y="525" text-anchor="middle" class="small" transform="rotate(-90 52 525)">GPU utilization</text>

    <path d="M110 590 L175 582 L200 468 L230 457 L260 466 L290 456 L320 463 L350 580 L500 585 L555 578 L580 466 L610 456 L640 464 L670 455 L700 462 L730 580 L880 585 L925 578 L950 467 L980 456 L1010 464 L1040 455 L1070 463 L1100 580 L1130 584" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M110 515 L160 508 L210 512 L260 505 L310 510 L360 503 L410 509 L460 504 L510 511 L560 505 L610 510 L660 503 L710 508 L760 504 L810 511 L860 505 L910 509 L960 503 L1010 508 L1060 504 L1110 509 L1130 506" fill="none" stroke="#f97316" stroke-width="3"/>

    <text x="1135" y="585" class="small" fill="#1d4ed8">Prefill GPU</text>
    <text x="1135" y="510" class="small" fill="#c2410c">Decode GPU</text>
  </g>

  <text x="600" y="650" text-anchor="middle" class="small">개념도 · 곡선의 높이는 실제 측정값이 아니며 workload, batch, scheduler에 따라 달라진다</text>
</svg>
